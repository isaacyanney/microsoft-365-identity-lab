name: PowerShell validation and Pester tests

on:
  push:
    paths:
      - "**/*.ps1"
      - "data/**/*.csv"
      - "sample-output/**/*.json"
      - ".github/workflows/powershell-syntax.yml"
  pull_request:
    paths:
      - "**/*.ps1"
      - "data/**/*.csv"
      - "sample-output/**/*.json"
      - ".github/workflows/powershell-syntax.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "Syntax errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force

      - name: Run Pester tests
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = "tests"
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = "Detailed"
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Validate synthetic evidence files
        shell: pwsh
        run: |
          Get-ChildItem -Path sample-output -Filter *.json | ForEach-Object {
            $sample = Get-Content -Raw $_.FullName | ConvertFrom-Json
            if ($sample.Environment -ne "Synthetic lab") {
              throw "Sample must identify the synthetic environment: $($_.FullName)"
            }
            if ($sample.ContainsTenantChanges -ne $false) {
              throw "Sample must confirm that no tenant changes occurred: $($_.FullName)"
            }
            Write-Host "Synthetic JSON OK: $($_.FullName)"
          }

          $required = @("EmployeeId","DisplayName","UserPrincipalName","Department","Role","Manager","LicenseProfile","AccessProfile","Status")
          Get-ChildItem -Path data -Filter *.csv | ForEach-Object {
            $rows = @(Import-Csv $_.FullName)
            if ($rows.Count -eq 0) { throw "CSV contains no records: $($_.FullName)" }
            $missing = @($required | Where-Object { $_ -notin $rows[0].PSObject.Properties.Name })
            if ($missing.Count -gt 0) { throw "CSV missing columns: $($missing -join ', ')" }
            if (@($rows | Where-Object { $_.UserPrincipalName -notlike "*.example" }).Count -gt 0) {
              throw "CSV contains a non-example UPN: $($_.FullName)"
            }
            Write-Host "Synthetic CSV OK: $($_.FullName)"
          }
